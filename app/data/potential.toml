ignored_keys = ["speed", "jump", "max_mp", "armor", "equipment_level_decrease"]
add_option_parts = ["훈장", "포켓 아이템"]   # 기본 옵션은 빼고 추가옵션(환생의 불꽃)만 환산하는 부위
