# 무기류(무기·보조무기·엠블렘)를 제외한 잠재·에디셔널 줄을 "유효 스탯%"로 바꾸는 상수. 규칙은 app/potential.py 의 convert_line 에 있습니다.
# 유효 1% = 잠재의 주스탯 1% 가 주는 가치. 캐릭터의 깡스탯 a(주스탯%가 적용되는 주스탯)의 1% 만큼 최종 주스탯이 오릅니다.
#   스탯공격력 A = w × 최종 주스탯 S + 최종 부스탯 d      (w 는 classes.toml stat_weight)
#   깡스탯 a = (S − c) ÷ b,  c = %미적용 주스탯(심볼·하이퍼·유니온·유니온 아티팩트·어빌리티·링크), b = 1 + 주스탯% 합 ÷ 100
#   고정 주스탯 1 = 100 × b ÷ a %                공/마 1 = 100 × A ÷ (w × a × 공/마) %
#   크뎀 1% = A ÷ ((crit_base + 크뎀') × w × a) %    크확 1% = A × (crit_base − 1 + 크뎀') ÷ (w × a × (1 + 크확 × (crit_base − 1 + 크뎀'))) %
#   a' · 공' · 크뎀' = 스탯창 값에 [buff] 의 도핑·버프 가정을 더한 값 (효율은 전투 중 상태를 기준으로 봅니다)
#   주스탯% N = N,  올스탯% N = N × (1 + 부스탯 수 × sub_stat_ratio),  부스탯% N = N × sub_stat_ratio,  제논 개별 스탯% N = N ÷ 3 (INT 제외)
sub_stat_ratio = 0.1              # 부스탯은 유효 스탯의 1/10
cooldown_per_second = 7.0         # 재사용 대기시간 1초 = 유효 스탯 7%
crit_base = 1.35                  # 크리티컬 기본 배율 (1 + 0.35)

[buff]                            # 효율 계산 시 켜져 있다고 보는 도핑·버프. 스탯창(API) 값에는 없으므로 여기서 더합니다
main_stat_flat = 30               # 향상된 10단계 물약 등 주스탯 +30 (깡스탯에 더해져 %가 적용됨)
attack_flat = 355                  # 익스트림 포션 등 고정 공격력 (공격력 % 배율이 적용됨)
attack_pct = 4                    # 영웅의 메아리 공격력 4%
ap_stat_pct = 16                  # 메이플 용사류(레프의 용사·아니마의 용사 등): AP 로 올린 주스탯의 16% 가 깡스탯에 더해짐
# 샤프 아이즈·길드 스킬·도핑 등 전투 중 켜지는 크뎀(%p). 메이플 스카우터 효율표에 맞춘 측정값:
# Lv298 나이트워커(크뎀 140.5) 크뎀 1% = 4.01, Lv290 렌(크뎀 108.9) 4.24 (메이플 용사류 AP 16% 가정 포함 기준)
crit_damage_pct = 54

[ap]                              # AP 로 올린 주스탯 추정: base + per_level × (레벨 − 1). 모두 주스탯에 투자했다고 봅니다
base = 4
per_level = 5

[bounds]                          # 계산값의 안전 범위 [최소, 최대]. 스탯 응답이 이상해도 점수가 튀지 않게 합니다
                                  # 랭킹 상위 24명 측정값: 고정 스탯 0.02~0.10, 공/마 0.07~0.48, 크뎀 3.0~5.8
pct_per_flat = [0.005, 0.5]
pct_per_attack = [0.01, 2.0]
pct_per_crit_damage = [0.3, 10.0]

[reference]                       # 스탯 응답이 없을 때(테스트·단독 호출) 쓰는 기준 캐릭터
level = 275
base_stat = 12000                 # a
stat_pct = 3.0                    # b
attack = 2500
crit_damage = 90.0
crit_rate = 100.0

[exempt_estimate]                 # 심볼 조회에 실패했을 때 레벨로 추정하는 %미적용 주스탯(심볼 + 하이퍼 + 유니온 등). [레벨 이하, 추정치], 오름차순 첫 일치
                                  # 측정값: Lv280 약 18,500 · Lv285~288 약 24,000 · Lv292 이상 약 29,000 (심볼 만렙 28,200 + 하이퍼·유니온 약 1,000)
bands = [[199, 0], [210, 2000], [220, 4000], [230, 7000], [245, 10000], [260, 14000], [275, 18000], [288, 24000], [999, 29000]]

[hyper_stat]
main_stat_per_level = 30          # 하이퍼스탯 STR/DEX/INT/LUK 레벨당 증가량. 응답의 stat_increase 문구를 읽지 못할 때만 씁니다

[crit_rate]                       # 크리티컬 확률 옵션. 캐릭터 크확이 zero_threshold(%) 이상이면 100% 까지 채우는 부분의 가치는 0
zero_threshold = 90
# 궁수 공용 5차 크리티컬 리인포스: 30초 동안 크확 전체의 (20 + 레벨)% 만큼 크뎀 증가(30레벨 50%), 재사용 120초. 100% 초과분 1% = ratio × uptime 만큼의 크뎀
reinforce_ratio = 0.5
reinforce_uptime = 0.25

# ── 무기 · 보조무기 · 엠블렘 (app/weapon.py) ──
# 단위 1 = 공격력(마력) 1%. 보공·데미지는 1 ÷ (1 + (데미지 + 보공) ÷ 100), 방무는 보스 방어율에서 남은 방어율 변화,
# 스탯 계열(주스탯·올스탯·크뎀 등)은 잠재와 같은 유효 스탯% 에 "유효 스탯 1% 의 공% 가치" 를 곱해 환산합니다.
[weapon]
boss_defense = 380                # 방무 환산 기준 보스 방어율 (%)

[weapon.buff]                     # 전투 중 가정. 메이플 스카우터 세부 스펙 효율(공격력% 단위, Lv298 나이트워커)에 맞춘 측정값
attack_pct_extra = 72             # 스탯창에 없는 스킬 패시브·버프 공격력 %p (스탯창 배율 + 영웅의 메아리에 더함)
boss_damage_extra = 475           # 보공·데미지 분모에 더하는 버프·패시브 %p
ied_extra_pct = 88                # 남은 방어율에 곱해 빼는 추가 방무 % (곱연산)

[weapon.best_lines]               # 캐릭터별 기준점(최상 조합): 후보는 종류별 최대값이고, 캐릭터에게 환산값이 가장 큰 줄이 count 줄 모두에 붙은 것을 최상으로 봅니다
count = { potential = 3, additional_potential = 3, soul = 3 }
soul_option = ["공격력 +3%"]        # 소울 옵션 1줄은 소울 잠재 최상 조합에 더합니다
destiny_keyword = "데스티니"        # 이름에 이 말이 있으면 destiny 표, 아니면 default 표(제네시스·보조무기·엠블렘). 엠블렘은 보공 후보를 뺍니다

[weapon.best_lines.destiny]
potential = ["공격력 +13%", "보스 몬스터 데미지 +45%", "몬스터 방어율 무시 +45%"]
additional_potential = ["공격력 +13%", "보스 몬스터 데미지 +20%", "몬스터 방어율 무시 +8%"]
soul = ["공격력 +8%", "보스 몬스터 데미지 +12%", "몬스터 방어율 무시 +5%"]   # 소울 잠재 종류별 최대값

[weapon.best_lines.default]
potential = ["공격력 +12%", "보스 몬스터 데미지 +40%", "몬스터 방어율 무시 +40%"]
additional_potential = ["공격력 +12%", "보스 몬스터 데미지 +18%", "몬스터 방어율 무시 +5%"]
soul = ["공격력 +8%", "보스 몬스터 데미지 +12%", "몬스터 방어율 무시 +5%"]

# ── 훈장 · 뱃지 · 포켓 아이템 · 칭호 (app/special.py) ──
# 고정 옵션(item_total_option, 칭호는 설명 문구)을 잠재와 같은 유효 스탯% 로 환산하고, 부위별 최상 아이템을 이 캐릭터 기준으로
# 환산한 값을 100 으로 두는 점수입니다. 표의 값은 item_total_option 과 같은 형태(기본 옵션 + 추옵 합계)입니다.
