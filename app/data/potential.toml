no_grade_parts = ["훈장", "뱃지"]           # 등급 문자를 매기지 않고 점수만 보여주는 부위
no_score_parts = ["뱃지"]                   # 점수도 보여주지 않고 전체 랭크 평균에서도 빼는 부위 (칭호는 항상 제외)

[special.ring]                    # 시드링: 점수 = 종류 가중치 × 레벨 ÷ max_level. 이름에 키워드가 있으면 그 가중치, 없으면 default
max_level = 6
weights = { "리스트레인트" = 100, "컨티뉴어스" = 100, "웨폰퍼프" = 80, "리스크테이커" = 60, "링 오브 썸" = 60 }
default = 50

[special.best."뱃지"]               # 창세의 뱃지: 올스탯 15 (각 스탯에 포함), 공/마 10
