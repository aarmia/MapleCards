# ── 훈장 · 뱃지 · 포켓 아이템 · 칭호 (app/special.py) ──
# 고정 옵션(item_total_option, 칭호는 설명 문구)을 잠재와 같은 유효 스탯% 로 환산하고, 부위별 최상 아이템을 이 캐릭터 기준으로
# 환산한 값을 100 으로 두는 점수입니다. 표의 값은 item_total_option 과 같은 형태(기본 옵션 + 추옵 합계)입니다.
