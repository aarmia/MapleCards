# 점수 공식의 상수. 값을 바꾸면 모든 캐릭터의 점수가 바뀌므로 배포 전에 결과 비교가 필요합니다.
# 정수로 적은 값은 정수로, 소수점이 있는 값은 실수로 읽힙니다. 응답의 숫자 형식이 그대로 따라가므로 형식을 바꾸지 마세요.

# ── 추가옵션 ─────────────────────────────────────────────
[add_option.grade]            # 추옵 급수 환산: 주스탯 + 올스탯% × a + 공격력(마력) × b
all_stat_pct_default = 10
all_stat_pct_all_stat = 20    # 제논
attack_default = 4
attack_all_stat = 5           # 제논
attack_hp = 15                # 데몬어벤져 (최대 HP + 공격력 × 15)
magic_int = 3                 # INT 직업은 마력 × 3

[add_option.targets]          # 아이템 레벨별 목표 급수. 표에 없는 레벨은 fallback 식(level × slope + offset)을 쓰고, min_level 미만이면 100점 처리
# 고자본(3~5억) 기준의 목표. 다른 자본대는 add_option.tiers 의 배율만 곱하고 기준값 자체는 바꾸지 않습니다.
default = { 250 = 186, 200 = 162, 160 = 144, 150 = 132, 140 = 126, 135 = 123, 130 = 120 }
default_fallback = { min_level = 100, slope = 0.6, offset = 42 }
xenon = { 250 = 300, 200 = 265, 160 = 240, 150 = 220 }
xenon_fallback = { min_level = 100, slope = 1.2, offset = 40 }
demon_avenger = { 250 = 4200, 200 = 3600, 160 = 2880, 150 = 2700 }
demon_avenger_fallback = { min_level = 100, slope = 18, offset = 0 }

[add_option]
no_add_parts = ["반지", "어깨장식", "기계 심장", "훈장", "뱃지", "포켓 아이템", "엠블렘", "보조무기", "무기"]   # 추옵을 평가하지 않는 부위 (100점 고정)

[add_option.curve]            # 목표 대비 차이(%)를 5% 단위로 누적. 초과분은 완만하게 가산, 부족분은 가속 감점
chunk = 5.0
above = { mult = 0.5, decay = 0.9 }
below = { mult = 1.2, decay = 1.05, cap = 3.0 }

[add_option.tiers]            # 캐릭터별 기준: 전투력으로 자본대를 나눠 목표 급수에 배율을 곱합니다. [전투력 하한, 이름, 배율], 하한 내림차순 첫 일치
bands = [[1000000000, "랭커", 1.15], [500000000, "초고자본", 1.08], [300000000, "고자본", 1.0], [100000000, "중고자본", 0.93], [30000000, "중자본", 0.87], [0, "저자본", 0.80]]

# ── 잠재능력 (방어구·장신구) ──────────────────────────────
[potential]
excluded_slots = ["무기", "보조무기", "엠블렘"]          # 무기류는 weapon 섹션으로 평가
cooldown_per_second = 7.25                            # 스킬 재사용 대기시간 -n초
all_stat_pct = 1.1                                    # 올스탯 n% 환산 배율
all_stat_pct_boost = 1.2
all_stat_pct_boost_classes = ["섀도어", "카데나", "듀얼블레이더"]
level_stat_fallback = 3.5                             # 캐릭터 레벨을 모를 때 레벨당 스탯 1 의 점수. 보통은 레벨 비례로 계산합니다
level_stat_interval_default = 9                       # "n레벨 당" 의 n 을 문구에서 못 읽을 때의 기본값
attack_flat = 0.3                                     # 공격력·마력 +n 의 기본 환산. 캐릭터 스탯이 있으면 conversion 으로 대체
stat_flat = 0.09                                      # 주스탯 +n 의 기본 환산. 캐릭터 스탯이 있으면 conversion 으로 대체
demon_avenger_additional = 0.9                        # 데몬어벤져 에디셔널 보정
# 점수에 넣지 않기로 한 옵션. 포함 문자열로 판정하며 로그 집계와 "미지원" 표시에서 뺍니다.
ignored_keywords = ["최대 MP", "방어력", "점프력", "이동속도", "회복", "피격 시", "확률로", "메소 획득량", "아이템 드롭률", "상태 이상"]
# 스탯을 언급하는 옵션인지 판정하는 키워드. 아래 relevant_keywords 에 없는 스탯이면 "다른 직업 스탯"으로 분류합니다.
stat_keywords = ["STR", "DEX", "INT", "LUK", "HP", "공격력", "마력"]

[potential.crit_damage]       # 크리티컬 데미지 환산. 윗잠재는 줄 수에 따라, 에디셔널은 고정
single = 1.125
multi = 1.875
additional = 4.0

[potential.xenon]             # 제논: STR/DEX/LUK 을 ÷3 로 합산한 뒤 전체 ×1.35
level_stat_divisor = 3.0
stat_pct_divisor = 3.0
attack_flat = 0.3
stat_flat = 0.09
multiplier = 1.35

[potential.conversion]        # 고정 수치 옵션의 % 환산을 캐릭터 스탯에서 유도합니다. b = 1 + (장비 잠재의 주스탯%·올스탯% 합 + baseline) ÷ 100
                              # 고정 스탯 1 = 100 × b² ÷ 주스탯,  공/마 1 = 25 × b × (4 × 주스탯 + 부스탯) ÷ (주스탯 × 공/마)   [단위: 주스탯 %]
enabled = true
baseline_stat_pct = 20        # 장비 잠재 밖의 주스탯% (하이퍼스탯 · 유니온 · 어빌리티 · 링크) 추정치
stat_flat_min = 0.01           # 최상위 스펙(주스탯 10만, 주스탯% 300)에서 약 0.015 가 나오므로 그 아래에서만 제한
stat_flat_max = 0.15
attack_flat_min = 0.02         # 최상위 스펙(공격력 1.5만)에서 약 0.03
attack_flat_max = 0.60
# 크리티컬 데미지 1% 의 가치 = b ÷ (crit_base + 캐릭터 크뎀 총합 ÷ 100). 크뎀이 높을수록 1% 의 가치가 줄어듭니다. 스탯 응답에 크뎀이 없으면 crit_damage 고정값
crit_base = 1.35
crit_min = 0.5
crit_max = 3.0

[potential.crit_rate]         # 크리티컬 확률 옵션. 캐릭터 크확이 zero_threshold(%) 이상이면 100% 까지 채우는 부분의 가치는 0 으로 봅니다.
zero_threshold = 90
# 궁수 공용 5차 크리티컬 리인포스: 30초 동안 크확 전체의 (20 + 레벨)% 만큼 크뎀 증가(30레벨 50%), 재사용 120초. 100% 초과분 1% = ratio × uptime 만큼의 크뎀
reinforce_ratio = 0.5
reinforce_uptime = 0.25

[potential.relevant_keywords]  # 주스탯별로 점수와 관련 있는 스탯 키워드
STR = ["STR", "공격력"]
DEX = ["DEX", "공격력"]
INT = ["INT", "마력"]
LUK = ["LUK", "공격력"]
HP = ["HP", "공격력"]
ALL_STAT = ["STR", "DEX", "LUK", "공격력"]

# ── 무기 · 보조무기 · 엠블렘 ──────────────────────────────
[weapon.add]                  # 무기 추옵: 공격력 비율(%) + 보공 + 데미지 + 올스탯 + 주스탯
boss_damage = 0.275
damage = 0.275
all_stat = 0.2475
main_stat = 0.05

[weapon.potential]
damage = 0.275
ignore_defense = 0.1875
all_stat_pct = 0.2475
main_stat_pct = 0.225

# ── 스타포스 ─────────────────────────────────────────────
[starforce]                   # 100 × (min(star, 22) / 22)² × (1 + (level − 200) / 600), 22성 초과분은 3 × ln(star − 21)
reference_level = 200
level_weight_divisor = 600.0
base_star = 22
over_star_log_weight = 3.0

# ── 축 가중치와 판정값 ───────────────────────────────────
[weights]
potential = 3.3               # 윗잠재 환산값 × 3.3
additional = 2.5              # 에디셔널 환산값 × 2.5
superior_star = 3.0           # 슈페리얼(타일런트) 스타포스 × 3
weapon_add = 2.0              # 무기 추옵 점수 × 2
fixed_secondary_emblem = 100.0   # 보조무기·엠블렘의 추옵·스타포스 고정 점수

[noljang]                     # 놀라운 장비 강화 판정 (별 8~15, 150제 이하, 슈페리얼 제외)
star_min = 8
star_max = 15
max_level = 150
etc_stat_strong = 50          # 기타 옵션 스탯 > 50 이고 공격력 > 10
etc_attack_strong = 10
etc_stat_weak = 30            # 스타포스 옵션 스탯이 0 이면 스탯 > 30 또는 공격력 > 15
etc_attack_weak = 15

[special_items]
wse_slots = ["무기", "보조무기", "엠블렘"]
special_parts = ["훈장", "뱃지", "포켓 아이템", "칭호"]
secondary_slots = ["보조무기", "엠블렘"]                  # 추옵·스타포스를 고정 점수로 두는 슬롯
excluded_rings = ["리스트레인트", "컨티뉴어스", "웨폰퍼프"]   # 시드링은 평가에서 제외
superior_keyword = "타일런트"
pocket_demon_avenger_divisor = 11
fixed = [["창세", 280.0], ["칠요", 250.0], ["불멸", 320.0]]   # 이름에 포함된 순서대로 첫 일치
default = 180.0
