        [12, 13, 15, 18, 22], [14, 15, 17, 20, 24], [17, 18, 20, 23, 27], [19, 20, 22, 25, 29]]
attack = [[1, 2, 3, 4, 5, 6, 8, 10, 12, 14], [2, 3, 4, 5, 6, 7, 9, 11, 13, 15], [3, 4, 5, 6, 7, 8, 10, 12, 14, 16],
          [4, 5, 6, 7, 8, 9, 11, 13, 15, 17], [5, 6, 7, 8, 9, 10, 12, 14, 16, 18], [6, 7, 8, 9, 10, 11, 13, 15, 17, 19],
          [7, 8, 9, 10, 11, 12, 14, 16, 18, 20], [8, 9, 10, 11, 12, 13, 15, 17, 19, 21], [9, 10, 11, 12, 13, 14, 16, 18, 20, 22]]

# ── 축 가중치와 판정값 ───────────────────────────────────
[noljang]                     # 놀라운 장비 강화 판정 (별 8~15, 150제 이하, 슈페리얼 제외)
