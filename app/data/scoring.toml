# 점수 공식의 상수. 값을 바꾸면 모든 캐릭터의 점수가 바뀌므로 배포 전에 결과 비교가 필요합니다.
# 정수로 적은 값은 정수로, 소수점이 있는 값은 실수로 읽힙니다. 응답의 숫자 형식이 그대로 따라가므로 형식을 바꾸지 마세요.

# ── 추가옵션 ─────────────────────────────────────────────
# 진단에서는 급수의 공/마·올스탯%·부스탯 계수를 캐릭터 효율로 계산합니다(calculator._context_add_rows).
# 아래 고정 계수는 캐릭터 스탯이 없는 단독 호출(테스트 등)에서만 쓰는 대체값입니다.
[add_option.grade]            # 추옵 급수 환산: 주스탯 + 올스탯% × a + 공격력(마력) × b
all_stat_pct_default = 10
all_stat_pct_all_stat = 20    # 제논
attack_default = 4
attack_all_stat = 5           # 제논
attack_hp = 15                # 데몬어벤져 (최대 HP + 공격력 × 15)
magic_int = 3                 # INT 직업은 마력 × 3
sub_stat_divisor = 10         # 부스탯(classes.toml secondary_stat)은 ÷ 10 으로 합산

[add_option.flame]            # 환생의 불꽃 최대치. 레벨 하한 내림차순 첫 일치: [레벨 하한, 단일 추옵, 이중 추옵, 최대 HP] 는 등급 1 당 수치
max_tier = 7                  # 최대 등급 (수치 × max_tier 가 최대값)
bands = [[250, 12, 7, 700], [200, 11, 6, 600], [160, 9, 5, 480], [150, 8, 4, 450], [140, 8, 4, 420], [0, 7, 4, 390]]
other_per_tier = 1            # 올스탯 %·공격력·마력은 등급당 1
# 최상 조합(calculator.flame_best_add_option) = 주스탯 단일 + 주스탯 이중 2줄(부스탯 포함) + 올스탯%·공/마 중 급수가 큰 쪽.
# 250제 = 주스탯 182 · 부스탯 49 · 올스탯 7%. 데몬어벤져는 최대 HP 단일, 제논은 이중 3줄. 추옵 축 = 급수 × 고정 주스탯 1 의 %p, 만점 = 최상 조합
# ── 주문서 ─────────────────────────────────────────────
# 주문서 축 = 주문서로 오른 스탯·공/마(item_etc_option)의 주스탯 %p. 만점 = 주문서 횟수 × 최상 주문서 1작.
# 횟수 = 성공(scroll_upgrade) + 남은(scroll_upgradeable_count) + 복구 가능(scroll_resilience_count). 황금망치는 없어진 기능이라 넣지 않습니다.
# 최상 주문서 1작에는 두 옵션이 함께 붙습니다. 놀장 장비는 주문서 칸에 들어 있는 놀장 스타포스 스탯을 빼고 계산합니다.
[scroll]
weapon = { main_stat = 4, attack = 9 }     # 무기: 주스탯 +4 · 공/마 +9
default = { all_stat = 6, attack = 6 }     # 그 외(방어구·장갑·장신구): 올스탯 +6 · 공/마 +6

[scroll.parts]                             # 부위 이름(item_equipment_part)에 이 말이 있으면 그 기준. 위 무기·그 외보다 먼저 봅니다. sub_stat 은 캐릭터 부스탯 하나(DEX 가 있으면 DEX, 없으면 첫 부스탯)
"기계 심장" = { all_stat = 3, attack = 11 }
"방패" = { main_stat = 30, sub_stat = 10, attack = 10 }   # 보조무기 방패: 주스탯 +30 · 부스탯 하나 +10 (DEX, 법사 방패는 LUK) · 공/마 +10
"블레이드" = { main_stat = 15, sub_stat = 15, attack = 9 }   # 보조무기 블레이드(듀얼블레이더): LUK +15 · DEX +15 · 공 +9

# ── 잠재능력 (방어구·장신구) ──────────────────────────────
# 환산 규칙과 계수는 app/data/potential.toml 에 있습니다. 여기는 옵션 분류 규칙만 둡니다.
[potential]
excluded_slots = ["무기", "보조무기", "엠블렘"]          # 무기류는 weapon 섹션으로 평가
# 점수에 넣지 않기로 한 옵션. 포함 문자열로 판정하며 로그 집계와 "미지원" 표시에서 뺍니다.
ignored_keywords = ["최대 MP", "방어력", "점프력", "이동속도", "회복", "피격 시", "확률로", "메소 획득량", "아이템 드롭률", "상태 이상"]
# 스탯을 언급하는 옵션인지 판정하는 키워드. 아래 relevant_keywords 에 없는 스탯이면 "다른 직업 스탯"으로 분류합니다.
stat_keywords = ["STR", "DEX", "INT", "LUK", "HP", "공격력", "마력"]

[potential.relevant_keywords]  # 주스탯별로 점수와 관련 있는 스탯 키워드
STR = ["STR", "공격력"]
DEX = ["DEX", "공격력"]
INT = ["INT", "마력"]
LUK = ["LUK", "공격력"]
HP = ["HP", "공격력"]
ALL_STAT = ["STR", "DEX", "LUK", "공격력"]

# 무기 · 보조무기 · 엠블렘의 환산 규칙과 상수는 potential.toml 의 [weapon] 에 있습니다.

# ── 스타포스 ─────────────────────────────────────────────
[starforce]

[starforce.max_star]          # 기준 만점 스타포스. 이름에 names 의 말이 있으면 그 값, 슈페리얼은 superior, 아니면 레벨 구간([레벨 미만, 최대 성] 오름차순, 없으면 default)
bands = [[118, 10], [128, 15], [138, 20]]
default = 30
superior = 15
names = { "제네시스" = 22, "데스티니" = 25 }

[starforce.benchmark]         # 스타포스 축 만점 = benchmark_star(22성)의 스탯·공/마 합계 (방어구·장신구). [레벨 하한, 스탯, 공/마] 내림차순 첫 일치
# 스타포스 축 = 스타포스로 오른 실제 스탯·공/마의 주스탯 %p ÷ 같은 레벨 22성 합계의 %p (23성 이상은 만점을 넘는 실제 값).
# 140제 미만은 starforce.gain 표의 22성(또는 그 레벨 최대 성) 합계가 만점입니다. 장갑은 모든 구간 공/마가 glove_attack_bonus 만큼 높아 만점에도 더합니다.
# 참고(수집 데이터 실측): 23~25성은 스탯 없이 공/마만 오르고 한 성마다 2씩 커집니다(250제 +23·+25·+27).
# 데몬어벤져는 주스탯 자리를 최대 HP 로 둡니다 (calculator._stat_option).
benchmark_star = 22
bands = [[250, 159, 120], [200, 145, 106], [160, 131, 92], [150, 117, 85], [140, 103, 78]]
glove_attack_bonus = 7

[starforce.weapon]            # 무기 스타포스 공/마. 스탯은 starforce.gain 과 같습니다. 출처: 나무위키 「메이플스토리/스타포스 강화」 5. 스탯 변동
# 1~15성: 성마다 내림(순수 공/마 ÷ low_divisor) + 1. 순수 공/마 = 기본 + 주문서(작), 앞 성에서 오른 만큼 다음 성 계산에 더해집니다.
# 16~22성: 레벨 행(starforce.gain.levels 와 같은 순서)의 attack_16 을 차례로 더합니다.
# 샘플 무기 25개(제네시스·데스티니·도전자의 무기)의 실제 스타포스 공/마와 모두 일치 (2026-11-06 확인).
# 원문 160제 16성 '+19' 는 오기로 보고 실측(+9)을 따릅니다. 23성 이상은 무기마다 달라 표 대신 로그 가산을 씁니다.
# 보조무기 중 기본 공/마가 weapon_like_min_attack 이상(블레이드·라피스 등)은 무기 규칙, 나머지는 방어구 표(starforce.gain)를 따릅니다.
low_divisor = 50
weapon_like_min_attack = 100
attack_16 = [
    [16, 16, 17, 17, 18, 19, 20],
    [13, 13, 14, 14, 15, 16, 17],
    [9, 9, 10, 11, 12, 13, 14],
    [8, 9, 9, 10, 11, 12, 13],
    [7, 8, 8, 9, 10, 11, 12],
    [6, 7, 7, 8, 9],
]

[starforce.gain]              # 성마다 오르는 스탯·공/마 (방어구·장신구). 출처: 나무위키 「메이플스토리/스타포스 강화」 5. 스탯 변동 (2026-11-05 확인)
# 1~15성은 레벨과 관계없이 스탯만 stat_1_15 만큼 (아이템에 있는 STR·DEX·INT·LUK 모두). 장갑은 glove_attack_stars 성에서 공/마 +1.
# 16성부터는 레벨 행(레벨 하한 내림차순 첫 일치)의 stat_16 · attack_16 을 16성부터 차례로 더합니다. 23성부터는 스탯 없이 공/마만 오릅니다.
# 행의 길이가 그 레벨의 최대 성입니다 (130제는 20성). 로더가 22성 합계를 starforce.benchmark.bands 와 대조합니다.
# 참고: 원문 130제 20성 누적 스탯이 78 로 적혀 있으나 상승치(+7)와 맞지 않아 상승치를 따릅니다 (130제는 스타포스 축 대상이 아님).
stat_1_15 = [2, 2, 2, 2, 2, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]
glove_attack_stars = [5, 7, 9, 11, 13, 14, 15]
levels = [250, 200, 160, 150, 140, 130]
stat_16 = [
    [17, 17, 17, 17, 17, 17, 17],
    [15, 15, 15, 15, 15, 15, 15],
    [13, 13, 13, 13, 13, 13, 13],
    [11, 11, 11, 11, 11, 11, 11],
    [9, 9, 9, 9, 9, 9, 9],
    [7, 7, 7, 7, 7],
]
attack_16 = [
    [14, 15, 16, 17, 18, 19, 21, 23, 25, 27, 28, 29, 30, 31, 32],
    [12, 13, 14, 15, 16, 17, 19, 21, 23, 25, 26, 27, 28, 29, 30],
    [10, 11, 12, 13, 14, 15, 17, 19, 21, 23, 24, 25, 26, 27, 28],
    [9, 10, 11, 12, 13, 14, 16, 18, 20, 22, 23, 24, 25, 26, 27],
    [8, 9, 10, 11, 12, 13, 15, 17, 19, 21, 22, 23, 24, 25, 26],
    [7, 8, 9, 10, 11],
]

[starforce.noljang]           # 놀라운 장비 강화(놀장) 단계별 상승치. 1~5성은 스탯, 6~15성은 공/마 (성마다의 증가량)
# 레벨 키는 하한(0 = 80제 미만). 일의 자리가 5인 레벨(예: 135)은 스탯이 앞뒤 레벨 평균의 정수, 공/마는 낮은 쪽을 따릅니다.
