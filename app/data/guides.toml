# 장비 가이드 규칙. 위에서부터 조건이 모두 맞는 첫 규칙의 문구를 씁니다. 순서가 곧 우선순위이며 마지막 규칙은 조건이 없어야 합니다.
#
# when 의 각 항목은 [필드, 비교, 값] 입니다. 값 자리에 필드 이름을 적으면 그 필드의 값과 비교합니다.
# 비교: "<", "<=", ">", ">=", "==", "!="
# 필드:
#   total                         아이템 총점
#   add / pot / eddy / starscore  축별 가중 점수 (추가옵션, 윗잠재, 에디셔널, 스타포스)
#   star                          현재 스타포스        star_next   star + 1
#   max_star                      아이템 레벨별 최대 스타포스 (star_cap 표)
#   at_cap                        star 가 22 이상이거나 max_star 이상
#   level                         아이템 레벨
#   add_evaluated / star_evaluated  이 부위에서 그 축을 평가하는지 (axes 표)
#   worst / next                  기준 대비 비율이 가장 낮은 축, 그다음 축의 이름
#   min_ratio                     평가 축 중 최저 비율
#   limited                       이벤트 반지 여부 (names.limited)      noljang   놀라운 장비 강화 여부
#   target_add                    추옵 완성 기준 (targets.add_*)
#   target_star_330 / target_star_17 / target_star_21   스타포스 목표 (targets 표, max_star 로 제한)
# name_any 에 names 표의 이름(문자열)을 적으면 아이템 이름에 그 목록 중 하나가 포함될 때, 목록을 직접 적으면 그 목록으로 판정합니다.
# part_any 는 부위 이름에 포함될 때 맞습니다.
# text 안의 {star_next} {worst} {next} {max_star} {target_star_330} {target_star_21} 는 계산값으로 바뀝니다.

[star_cap]                     # [레벨 미만, 최대 스타포스]. 어느 구간에도 없으면 default
bands = [[118, 10], [128, 15], [138, 20]]
default = 30

[axes]
labels = ["추가옵션", "윗잠재", "에디셔널", "스타포스"]
benchmarks = [110, 108, 40, 105]           # 축별 기준점. 비율 = 점수 / 기준
no_add_parts = ["반지", "어깨장식", "기계 심장", "보조무기", "엠블렘"]   # 추옵 축을 평가하지 않는 부위
no_star_parts = ["보조무기", "엠블렘"]                                  # 스타포스 축을 평가하지 않는 부위

[targets]
add_level_split = 200          # 아이템 레벨이 이 값 이하면 add_low, 아니면 add_high 가 추옵 완성 기준
add_low = 103.5
add_high = 101
star_330_level_split = 160     # 330점대 목표 스타포스: 레벨이 이 값 이하면 star_330_low, 아니면 star_330_high
star_330_low = 23
star_330_high = 22
star_mid = 17                  # 250 · 175점대 목표
star_step = 21                 # 300점대 단계적 강화 목표 (max_star 가 더 낮으면 max_star)

[names]
upgrade_hearts = ["리튬 하트", "페어리 하트", "티타늄 하트"]
target_hearts = ["리튬 하트", "페어리 하트", "티타늄 하트", "플라즈마 하트"]
black_hearts = ["블랙 하트"]
superior = ["타일런트"]
limited = ["이터널 플레임 링", "어웨이크 링", "테네브리스 원정대 반지", "글로리온 링 : 슈프림", "카오스 링", "SS급 마스터 쥬얼링", "결속의 반지"]

# ── 특수 장비 (훈장 · 뱃지 · 포켓 아이템 · 칭호). 필드는 total 만 있습니다. ──

# 특수부위(훈장·뱃지·포켓·칭호): total 은 부위별 최상 아이템 대비 % (100 = 최상), expired 는 칭호 옵션 만료 여부
[[special_rule]]
part_any = ["칭호"]
when = [["expired", "==", true]]
text = "🚨 [만료] 칭호 옵션 적용 기간이 끝나 스탯이 적용되지 않습니다. 칭호를 갱신하거나 교체하세요."

[[special_rule]]
when = [["total", ">=", 95]]
text = "👑 [종결] 이 부위의 최상 옵션입니다."

[[special_rule]]
part_any = ["포켓 아이템"]
when = [["total", ">=", 70]]
text = "✅ 준수한 가성비 성배입니다."

[[special_rule]]
part_any = ["포켓 아이템"]
text = "🚨 더 높은 급수의 성배(최상 대비 70% 이상)로 교체를 추천합니다."

[[special_rule]]
part_any = ["뱃지"]
text = "💡 칠요의 뱃지 혹은 창세의 뱃지로의 업그레이드 목표를 잡으세요."

[[special_rule]]
part_any = ["훈장"]
when = [["total", ">=", 70]]
text = "✅ 준수한 훈장입니다. 불멸의 유산 추옵 작으로 더 올릴 수 있습니다."

[[special_rule]]
part_any = ["훈장"]
text = "💡 더 높은 등급의 훈장(불멸의 유산 + 추옵) 획득을 권장합니다."

[[special_rule]]
part_any = ["칭호"]
text = "💡 보공 30% · 방무 30% · 공/마 30 급 칭호로 교체를 고려하세요."

[[special_rule]]
part_any = ["특수 반지"]
when = [["total", ">=", 60]]
text = "💡 시드링 레벨을 더 올리면 점수가 오릅니다."

[[special_rule]]
part_any = ["특수 반지"]
text = "💡 리스트레인트 링 또는 컨티뉴어스 링 고레벨로 교체를 권장합니다."

[[special_rule]]
text = "✅ 해당 부위는 표준 성능을 보여주고 있습니다."

# ── 일반 장비 ──
# 일반 규칙의 ratio 는 기준 만점 대비 % (등급·랭크와 같은 기준), *_ratio 는 축 점수 ÷ 축 기준점

[[rule]]
when = [["noljang", "==", true]]
text = "💎 [놀라운 장비 강화 아이템] 놀라운 장비 강화 아이템을 착용중입니다. 교체를 원하신다면 명백한 상위 아이템과 베이스의 아이템으로 교체하세요."

[[rule]]
name_any = "upgrade_hearts"
when = [["ratio", ">=", 34]]
text = "🚨 [업그레이드 권장] 현재 하트는 성능 한계가 명확합니다. 플라즈마 하트로의 강화를 고려하세요."

[[rule]]
name_any = "target_hearts"
when = [["ratio", ">=", 76]]
text = "🚨 [교체 권장] 현재 하트는 성능 한계가 명확합니다. 컴플리트 언더컨트롤로의 교체를 고려해야할 시기입니다."

[[rule]]
name_any = "black_hearts"
text = "🚨 [미지원] 블랙 하트는 점수 환산을 지원하지 않습니다."

[[rule]]
name_any = "superior"
when = [["ratio", ">=", 77]]
text = "✨ [교체 권장] 어느정도 완성된 슈페리얼 아이템입니다. 교체를 원하신다면 지금의 아이템보다 상위의 아이템으로 교체를 추천합니다."

[[rule]]
name_any = "superior"
text = "⚠️ [교체 권장] 하나에서 두개 정도 부분이 아쉬운 슈페리얼 아이템입니다. 강화를 하시기보다는 동급이나 상위의 아이템으로 교체를 추천합니다."

# 350점 이상
[[rule]]
when = [["ratio", ">=", 96], ["at_cap", "==", true], ["add_evaluated", "==", true], ["add", "<", "target_add"]]
text = "✨ [추가옵션 강화 / 전승] 추가옵션이 완성되지 않았습니다. 강화하거나, 전승을 고려하세요."

[[rule]]
when = [["ratio", ">=", 96], ["at_cap", "==", true], ["pot_ratio", "<", 0.94]]
text = "✨ [잠재능력 강화 / 전승] 베이스는 완벽합니다. 잠재능력 수치를 극대화하기 위해 강화하거나, 전승을 고려하세요."

[[rule]]
when = [["ratio", ">=", 96], ["at_cap", "==", true], ["eddy_ratio", "<=", 1.08]]
text = "✨ [에디/교체 권장] 베이스는 완벽하지만, 에디셔널을 강화하거나 상위 매물로 교체하세요"

[[rule]]
when = [["ratio", ">=", 96], ["at_cap", "==", true]]
text = "👑 [종결] 완벽한 장비입니다. {star_next}성 도전 외엔 투자가 무의미합니다."

[[rule]]
when = [["ratio", ">=", 96]]
text = "🔍 [미세조정] 종결급이나 '{worst}'이(가) 평균보다 낮습니다."

# 330점 이상
[[rule]]
when = [["ratio", ">=", 91], ["star", ">=", 23]]
text = "✨ [종결 / 상위매물 교체] 23성 이상 도달한 장비입니다. 추가 강화보다는 이대로 사용하시거나, 상위 등급의 베이스 아이템 매물로 교체하는 것을 추천합니다."

[[rule]]
when = [["ratio", ">=", 91], ["star_evaluated", "==", true], ["star", "<", "target_star_330"]]
text = "⭐ [스타포스 권장] 체급에 걸맞은 '{target_star_330}성' 달성이 시급합니다. 우선적으로 {star_next}성 강화를 최우선하세요."

[[rule]]
when = [["ratio", ">=", 91]]
text = "💎 [준종결] 종결급 체급입니다. 마지막 퍼즐인 '{worst}' 수치 보완을 추천합니다."

# 300점 이상
[[rule]]
when = [["ratio", ">=", 83], ["star_evaluated", "==", true], ["star", ">=", "max_star"]]
text = "✅ [강화 한계] 최대치까지 강화되었습니다. 이제 부족한 '{worst}'에 집중하세요."

[[rule]]
when = [["ratio", ">=", 83], ["star_evaluated", "==", true], ["star", "<=", 18]]
text = "⚔️ [단계적 강화] 베이스가 훌륭합니다. 우선 '{target_star_21}성 안착'을 목표로 강화를 추천합니다."

[[rule]]
when = [["ratio", ">=", 83], ["star_evaluated", "==", true], ["star", "<", 22], ["min_ratio", "<", 0.25]]
text = "🚨 [밸런스 보완] 스타포스보다 급한 것은 '{worst}'입니다. 밸런스를 먼저 맞춰주세요."

[[rule]]
when = [["ratio", ">=", 83], ["star_evaluated", "==", true], ["star", "<", 22]]
text = "📈 [상위 강화] 22성 도전의 가치가 있는 베이스입니다. 22성 강화를 고려하세요."

[[rule]]
when = [["ratio", ">=", 83]]
text = "🛠️ [강화 권장] 엘리트 장비입니다. 전체적인 밸런스를 위해 '{worst}'을 보완하세요."

# 250점 이상
[[rule]]
when = [["ratio", ">=", 69], ["star_evaluated", "==", true], ["star", "<", "target_star_17"], ["max_star", "<", 17]]
text = "📦 [가성비 강화] 해당 아이템의 한계치인 {max_star}성 달성 후 잠재능력을 손보는 것이 효율적입니다."

[[rule]]
when = [["ratio", ">=", 69], ["star_evaluated", "==", true], ["star", "<", "target_star_17"]]
text = "📦 [가성비 강화] 최소 17 ~ 18성 달성 후 잠재능력을 손보는 것이 효율적입니다."

[[rule]]
when = [["ratio", ">=", 69]]
text = "📈 [효율 투자 / 교체] '{worst}'부터 차근차근 올리거나, 상위 아이템으로 교체를 추천합니다."

# 175점 이상
[[rule]]
when = [["ratio", ">=", 48], ["limited", "==", false], ["star_evaluated", "==", true], ["star", "<", "target_star_17"], ["max_star", "<", 17]]
text = "📦 [가성비 정체] 베이스는 나쁘지 않으나 스타포스가 낮습니다. {max_star}성(한계치) 강화 시 점수가 상승합니다."

[[rule]]
when = [["ratio", ">=", 48], ["limited", "==", false], ["star_evaluated", "==", true], ["star", "<", "target_star_17"]]
text = "📦 [가성비 정체] 베이스는 나쁘지 않으나 스타포스가 낮습니다. 17성 강화 시 점수가 대폭 상승합니다."

[[rule]]
when = [["ratio", ">=", 48], ["limited", "==", true]]
text = "📈 [이벤트 아이템] 이벤트 아이템을 강화하기보다는, 무료 재화를 사용하거나 상위 아이템으로의 교체를 추천합니다."

[[rule]]
when = [["ratio", ">=", 48], ["pot_ratio", "<", 0.6], ["eddy_ratio", "<", 0.31]]
text = "🔮 [잠재 / 에디 부족] 스타포스에 비해 잠재능력이 아쉽습니다. 더 높은 잠재능력을 위해 강화하거나 교체를 추천합니다."

[[rule]]
when = [["ratio", ">=", 48], ["pot_ratio", "<", 0.6]]
text = "🔮 [잠재 부족] 스타포스에 비해 잠재능력이 아쉽습니다. 더 높은 잠재능력을 위해 강화하거나 교체를 추천합니다."

[[rule]]
when = [["ratio", ">=", 48], ["eddy_ratio", "<", 0.31]]
text = "🔮 [에디 부족] 스타포스에 비해 에디셔널 잠재능력이 아쉽습니다. 더 높은 에디셔널 잠재능력을 위해 강화를 추천합니다."

[[rule]]
when = [["ratio", ">=", 48], ["add_evaluated", "==", true], ["add_ratio", "<", 0.75]]
text = "🌀 [베이스 부실] 추옵이 낮아 투자가 비효율적입니다. 추가옵션의 강화를 추천합니다."

[[rule]]
when = [["ratio", ">=", 48]]
text = "✅ [다음 단계 준비] 전반적인 밸런스가 좋습니다. 다음 단계로 넘어가기 위한 상위 아이템 교체나 {next} 강화를 준비하세요."

[[rule]]
text = "🚨 [교체 시급] 현재 세팅에서 가장 효율이 떨어지는 부위입니다. 상위 아이템으로 교체를 추천합니다."
