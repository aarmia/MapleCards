# 노작(스타포스·주문서 전) 시세의 기본값, 단위 억 메소. 사용자가 화면에서 바꿀 수 있고, 기본값은 관리자가 이 파일에서 바꿉니다.
# item: 이름에 name 이 들어 있고(parts 가 있으면 부위 또는 장착 칸(무기·보조무기)도 맞을 때) 처음 맞는 항목을 씁니다. 시세는 starforce.gg/ev 기본값 (2026-11-05).
# default: 등록되지 않은 아이템. [레벨 하한, 시세] 내림차순 첫 일치 (각 레벨에서 등록된 가장 낮은 시세)
