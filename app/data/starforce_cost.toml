# 스타포스 기대 비용 설정. 계산은 화면(app/static/js/app.js starforceCost)이 합니다. starforce.gg/ev 와 같은 계산 방식·값입니다 (2026-11-05 확인).
# 이벤트는 샤타(15~16 미포함)로 고정합니다. 12성 미만은 계산하지 않습니다 (비용 0 으로 봅니다).
# 숫자를 바꾸면 모든 캐릭터의 스펙업 추천이 바뀝니다. 배포 전에 결과를 비교하세요.

[event]                          # 샤타 without 15-16
cost_multiplier = 0.7            # 강화 비용 30% 할인
destroy_multiplier = 0.7         # destroy_max_star 이하에서 파괴 확률 30% 감소 (줄어든 만큼 실패로)
destroy_max_star = 21
restore_multiplier = 0.8         # 복구 메소 20% 할인

[odds]                           # 현재 성 = [성공, 실패(유지), 파괴]. 스타캐치(성공 × 1.05) 적용값
