# 직업 → 주스탯. 직업명은 공백을 제거한 뒤 비교합니다. 값은 "str" "dex" "int" "luk" "hp" "all_stat" 중 하나입니다.
# 루트 키는 첫 테이블 헤더보다 위에 있어야 합니다.
default = "str"   # 어느 그룹에도 없는 직업의 기본값

[main_stat]
str = ["히어로", "팔라딘", "다크나이트", "소울마스터", "미하일", "데몬슬레이어", "아란", "카이저", "제로", "블래스터", "렌", "아델", "바이퍼", "스트라이커", "은월", "캐논마스터", "아크"]
dex = ["보우마스터", "신궁", "패스파인더", "윈드브레이커", "와일드헌터", "메르세데스", "카인", "캡틴", "메카닉", "엔젤릭버스터"]
int = ["아크메이지(불,독)", "아크메이지(썬,콜)", "비숍", "플레임위자드", "에반", "루미너스", "배틀메이지", "일리움", "라라", "키네시스", "레테"]
luk = ["나이트로드", "섀도어", "듀얼블레이더", "나이트워커", "팬텀", "카데나", "칼리", "호영"]

# 주스탯이 아닌 기준으로 평가하는 직업. 그룹보다 먼저 적용됩니다.
[special]
"데몬어벤져" = "hp"
"제논" = "all_stat"

# 주스탯 전환 가능 직업. 스탯 응답이 주어지면 alternative 스탯이 base 보다 높을 때 alternative 로 평가합니다.
[switchable]
"바이퍼" = { base = "str", alternative = "dex" }
"캐논마스터" = { base = "str", alternative = "dex" }
"캡틴" = { base = "dex", alternative = "str" }

