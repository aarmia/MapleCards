# ── 추가옵션 재설정(메소) ──
# 출처: 넥슨 공식 확률 안내(추가 옵션): 검은/영원한 환생의 불꽃·추가옵션 재설정 단계 1~5 = 0·29·45·25·1%, 보스 장비는 +2단계·항상 4줄,
# 옵션 종류는 장비 분류별 목록에서 균등·중복 없이. 1회 비용 0.03억(mapletiptip.com/calculator/addopt-armor)
# 모든 대상 장비를 보스 장비(4줄)로 봅니다.
[flame]
cost = 0.03                      # 1회 억 메소
first_step = 7.5                 # 추천 목표: 현재 급수 + first_step 이상, 그 뒤 step 급씩 (+7.5 · +12.5 · +17.5 …)
step = 5
tiers = [2, 3, 4, 5]
tier_odds = [0.29, 0.45, 0.25, 0.01]
boss_bonus = 2
lines = 4
# 방어구·장신구 옵션 종류 19개. 값이 없는 종류(방어력·이동속도·점프력·착용 레벨 감소·MP)도 뽑힐 칸을 차지합니다.
options = ["str", "dex", "int", "luk", "str+dex", "str+int", "str+luk", "dex+int", "dex+luk", "int+luk",
           "max_hp", "max_mp", "equipment_level_decrease", "armor", "attack_power", "magic_power", "speed", "jump", "all_stat"]
