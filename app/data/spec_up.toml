"5" = { material = "생명의 연마석", count = 10, meso = 5_000_000_000 }
"6" = { material = "신념의 연마석", count = 20, meso = 20_000_000_000 }

[seed_ring.materials]            # 연마석 기본 시세(억 메소). 사용자가 화면에서 바꿀 수 있고 기본값은 관리자가 여기서 바꿉니다. 출처: 메이플증권 2026-11-04
