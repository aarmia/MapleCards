# 스펙업 추천 (app/spec_up.py): 강화 행동마다 기대 비용 100억 메소당 주스탯% 증가량(효율)을 계산해 높은 순으로 추천합니다.
# 스타포스 비용은 starforce_cost.toml, 큐브 옵션 확률은 potential_odds.json(넥슨 공식 확률 안내)에 있습니다.
# 숫자를 바꾸면 모든 캐릭터의 추천이 바뀝니다. 배포 전에 결과를 비교하세요.

[ranking]
unit = 10_000_000_000            # 효율 단위: 100억 메소
top = 5                          # 화면에 보여 줄 추천 개수

# ── 잠재능력·에디셔널 재설정(메소) ──
# 비용 출처: mapletiptip.com/calculator/potential · additional 표 (2026-11-05, 0.01억 단위로 반올림된 값)
# 등급업 확률·천장 출처: 넥슨 공식 확률 안내. 천장 = 연속 실패 횟수, 그다음 재설정은 확정 등급업
[cube]
grades = ["레어", "에픽", "유니크", "레전드리"]
# 추천 목표 X 의 범위: 현재 + min_step 이상, 그 아이템의 축 만점(점수 기준점) 이하. 현재가 만점 이상이면 그 축은 추천하지 않습니다.
# 성공 시 기대값에는 만점을 넘는 결과(두·세 번째 줄 레전드리)도 그대로 포함합니다.

[cube.potential]
cost = [[250, [0.05, 0.20, 0.43, 0.50]], [200, [0.05, 0.18, 0.38, 0.45]], [160, [0.04, 0.17, 0.36, 0.43]], [0, [0.04, 0.16, 0.34, 0.40]]]   # [레벨 하한, 등급별 1회 억 메소] 내림차순
grade_up = [0.15, 0.035, 0.014]  # 레어→에픽, 에픽→유니크, 유니크→레전드리
pity = [10, 42, 107]
min_step = 2.5                   # 최소 상승폭 (주스탯%p)

[cube.additional]
cost = [[250, [0.12, 0.34, 0.83, 0.98]], [200, [0.11, 0.31, 0.75, 0.88]], [160, [0.10, 0.29, 0.71, 0.83]], [0, [0.10, 0.27, 0.66, 0.78]]]
grade_up = [0.02381, 0.009804, 0.007]
pity = [62, 152, 214]
min_step = 1.0

# ── 매물 교체 (같은 아이템, 방어구·장신구) ──
# 등급마다 [250제, 200제 이하] 값. pot·eddy 는 윗잠재·에디셔널의 주스탯 %p, add 는 추옵 급수(200제 미만은 200제 값 × 레벨별 불꽃 최대 급수 비율).
# 주문서는 1작당 옵션: armor(방어구) · accessory(장신구). first_attack 이 있으면 첫 작만 그 공/마, 나머지는 attack.
# 매물 비용 = 직접 만드는 기댓값: 노작 시세 + 스타포스 0→star 성(화면) + 윗잠재·에디셔널 레어→목표 큐브 × cube_cost_share + 추옵 불꽃
#            + 주문서 횟수 × scroll_cost(억, armor·accessory).
# 추천 조건: 교체로 오르는 메큘레이터 지수가 지금 지수의 min_index_gain_pct % 이상일 때만 (스펙에 비해 의미 있는 교체만).
[listing]
cube_cost_share = 0.3333333      # 잠재·에디 큐브 기댓값에 곱하는 비율 (관리자 입력: 기댓값의 1/3)
flame_cost_share = 0.3333333     # 추옵 불꽃 기댓값에 곱하는 비율 (1/3)
radiant_flame_cost_share = 0.25  # 광휘 아이템의 추옵 불꽃 비율 (1/4)
radiant_star_cap = 23            # 광휘로 바꿀 수 있는 칠흑 아이템의 스타포스 추천 상한
min_index_gain_pct = 0.5         # 메큘레이터 지수 대비 최소 증가 %
grade_cap = { "보스 장신구 세트" = 4, "여명의 보스 세트" = 5 }   # 이 세트 아이템의 매물은 이 등급까지만 (같은 아이템·교체 대상 모두)
eternal_bundle_sets = [4, 8]
# 기계 심장은 3단계까지: 스타포스·잠재·에디는 공통 1~3등급 값, 주문서 1작 옵션과 비용(억)만 하트 전용
heart_scroll = [{ all_stat = 3, attack = 9 }, { all_stat = 3, attack = 10 }, { all_stat = 3, attack = 11 }]
heart_scroll_cost = [0, 1, 25]
final_items = ["거대한 공포"]       # 최종 아이템: 상위 아이템 교체 없이 같은 아이템의 상위 매물만
# 광휘 교체 순서 (부위 단위, 앞 단계를 마친 뒤에만 다음 단계). 세트를 덜 깨뜨리는 칸부터 바꾸고, 광휘는 1단계 매물로만 교체
radiant_order = [["훈장"], ["반지"], ["반지", "펜던트"], ["눈장식"], ["얼굴장식"]]
radiant_grade2_from = 4            # 이 순서(원혼)부터는 1단계 매물이 지금 아이템보다 못하면 2단계 매물로 바로 추천
radiant_needs_pitched = 10         # 광휘 세트 아이템(장신구·불멸의 유산)은 칠흑 세트를 이만큼 착용했을 때만 추천
medal_add = 205                    # 불멸의 유산 교체: 1단계 하나, 추옵 급수     # 아케인셰이드 → 에테르넬은 묶음만: 에테르넬이 이 세트 수에 닿는 최소 묶음과 바꿀 수 있는 전체 묶음

