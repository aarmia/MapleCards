# 스펙업 추천 (app/spec_up.py): 강화 행동마다 기대 비용 100억 메소당 주스탯% 증가량(효율)을 계산해 높은 순으로 추천합니다.
# 스타포스 비용은 starforce_cost.toml, 큐브 옵션 확률은 potential_odds.json(넥슨 공식 확률 안내)에 있습니다.
# 숫자를 바꾸면 모든 캐릭터의 추천이 바뀝니다. 배포 전에 결과를 비교하세요.

[ranking]
unit = 10_000_000_000            # 효율 단위: 100억 메소
top = 5                          # 화면에 보여 줄 추천 개수

# ── 잠재능력·에디셔널 재설정(메소) ──
# 비용 출처: mapletiptip.com/calculator/potential · additional 표 (2026-11-05, 0.01억 단위로 반올림된 값)
# 등급업 확률·천장 출처: 넥슨 공식 확률 안내. 천장 = 연속 실패 횟수, 그다음 재설정은 확정 등급업
[cube]
grades = ["레어", "에픽", "유니크", "레전드리"]
# 추천 목표 X 의 범위: 현재 + min_step 이상, 그 아이템의 축 만점(점수 기준점) 이하. 현재가 만점 이상이면 그 축은 추천하지 않습니다.
# 성공 시 기대값에는 만점을 넘는 결과(두·세 번째 줄 레전드리)도 그대로 포함합니다.

[cube.potential]
cost = [[250, [0.05, 0.20, 0.43, 0.50]], [200, [0.05, 0.18, 0.38, 0.45]], [160, [0.04, 0.17, 0.36, 0.43]], [0, [0.04, 0.16, 0.34, 0.40]]]   # [레벨 하한, 등급별 1회 억 메소] 내림차순
grade_up = [0.15, 0.035, 0.014]  # 레어→에픽, 에픽→유니크, 유니크→레전드리
pity = [10, 42, 107]
min_step = 2.5                   # 최소 상승폭 (주스탯%p)

[cube.additional]
cost = [[250, [0.12, 0.34, 0.83, 0.98]], [200, [0.11, 0.31, 0.75, 0.88]], [160, [0.10, 0.29, 0.71, 0.83]], [0, [0.10, 0.27, 0.66, 0.78]]]
grade_up = [0.02381, 0.009804, 0.007]
pity = [62, 152, 214]
min_step = 1.0

# ── 시드링 (리스트레인트 링 · 컨티뉴어스 링) ──
# 레벨별 효과 출처: 나무위키 「특수 스킬 반지」 (2026-11-05 확인).
# 리스트레인트: 극딜에 맞춰 켜지는 구간 버프(실제 사용 간격은 쿨감에 따라 120초보다 짧음). 가치 = 구간 딜 비중(burst_share) × 구간 안 공/마 상대 증가.
# 컨티뉴어스: 패시브. 준비 120초 뒤 스킬을 쓸 때마다 30초 효과가 갱신되어 사실상 상시 유지(uptime). 가치 = uptime × 상대 증가.
# 최종 데미지(%) 를 캐릭터 주스탯% 로 환산해 다른 추천과 같은 기준으로 비교합니다.
[seed_ring.restraint]            # 리스트레인트 링: 레벨 = [지속(초), 공격력·마력 %]
"4" = [15, 68]
"5" = [20, 68]
"6" = [20, 85]

[seed_ring.continuous]           # 컨티뉴어스 링(패시브): 레벨 = [보스 공격 시 데미지 %, 공격력·마력 %]
uptime = 1.0                     # 가동률. 스킬 사용 때마다 30초가 갱신되어 보스전 내내 유지된다고 봅니다
"4" = [36, 10]
"5" = [45, 12]
"6" = [54, 14]

[seed_ring.upgrade]              # 다음 레벨로 올리는 비용(최대 개수 사용 = 확정 성공)
"5" = { material = "생명의 연마석", count = 10, meso = 5_000_000_000 }
"6" = { material = "신념의 연마석", count = 20, meso = 20_000_000_000 }

[seed_ring.materials]            # 연마석 기본 시세(억 메소). 사용자가 화면에서 바꿀 수 있고 기본값은 관리자가 여기서 바꿉니다. 출처: 메이플증권 2026-11-04
"생명의 연마석" = 8.43
"신념의 연마석" = 31.67

# ── 소울 증폭 (요구 레벨 200 이상 무기의 위대한 소울) ──
# 확률·메소 출처: 넥슨 공식 소울웨폰 가이드 (maplestory.nexon.com/Guide/N23GameInformation/Articles/416, 2026-11-06 확인)
# 실패할 때마다 성공 확률이 step 만큼 오르고, pity 번 연속 실패하면 다음 시도는 확정 성공. 1회 시도에 그 단계 에테르 1개 + meso.
# 소울 잠재 수치는 증폭 단계에 정비례(1단계 값 × 단계)한다고 봅니다. 공/마%·보공은 커뮤니티 표와 실제 API 응답으로 확인했고
# 나머지 옵션은 같은 규칙을 가정합니다. 그래서 n→n+1 단계의 증가 = 지금 소울 잠재 3줄 × (n+1)/n − 지금.
[soul]
min_level = 200
keyword = "위대한"
first_lines = [2, 1.5]           # 0→1단계: 레전드리 공/마% 두 줄(첫 줄 레전드리, 둘째 줄 유니크)을 뽑아 쓴다고 가정한 1단계 수치(%). 재설정 비용은 넣지 않습니다

[soul.amplify]                   # 목표 단계 = { 기본 확률, 실패당 확률 증가, 확정까지 연속 실패 수, 1회 메소, 재료 }
"1" = { chance = 0.05, step = 0.01, pity = 25, meso = 500_000_000, material = "1단계 소울 에테르" }
"2" = { chance = 0.03, step = 0.006, pity = 33, meso = 1_000_000_000, material = "2단계 소울 에테르" }
"3" = { chance = 0.02, step = 0.004, pity = 43, meso = 1_750_000_000, material = "3단계 소울 에테르" }
"4" = { chance = 0.015, step = 0.003, pity = 50, meso = 2_750_000_000, material = "4단계 소울 에테르" }

[soul.materials]                 # 에테르 기본 시세(억 메소). 화면에서 바꿀 수 있습니다. 출처: hoonjaelab.com 엘리시움 경매장 최저 등록가 2026-10-13 (4단계는 매물 1건)
"1단계 소울 에테르" = 5.9
"2단계 소울 에테르" = 10.47
"3단계 소울 에테르" = 10.3
"4단계 소울 에테르" = 50

# 직업별: 리스트레인트 구간(15초 = 4레벨, 20초 = 5레벨 이상)이 전체 딜에서 차지하는 비중(%) = [15초, 20초].
# 값은 두 종류이며 줄마다 주석으로 구분합니다.
#   실측   = 연무장 리플레이 분석 (tools/burst_share/analyze.py). 리레를 쓴 시각부터 구간을 잡고, 타임라인 스킬 딜은 사용 시각에,
#            타임라인에 없는 연타 딜은 타임라인 스킬과 같은 비율로 구간에 몰린다고 본 값(상한)의 기록별 중앙값.
#            극딜 중에는 연타도 극딜 버프를 받고, 사용 1회당 딜을 같게 보는 방식이 구간 딜을 낮게 잡으므로 상한을 씁니다.
#            실제 리레 사용 간격(쿨감 모자·유니온 쿨감 등)이 그대로 반영됩니다.
#   비실측 = fmkorea.com/9614713510 (2026-03-20) 커뮤니티 표("컨티만 끼고 딜했을 때 리레 구간 딜비중", 무보엠 허수 측정).
#            측정 방법이 공개되지 않은 불확실한 값이며 우리 실측으로 검증하지 않았습니다. 렌은 실측이 표보다 약 2~3%p 낮았습니다.
