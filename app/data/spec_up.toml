# ── 시드링 (리스트레인트 링 · 컨티뉴어스 링) ──
# 레벨별 효과 출처: 나무위키 「특수 스킬 반지」 (2026-11-05 확인).
# 리스트레인트: 극딜에 맞춰 켜지는 구간 버프(실제 사용 간격은 쿨감에 따라 120초보다 짧음). 가치 = 구간 딜 비중(burst_share) × 구간 안 공/마 상대 증가.
# 컨티뉴어스: 패시브. 준비 120초 뒤 스킬을 쓸 때마다 30초 효과가 갱신되어 사실상 상시 유지(uptime). 가치 = uptime × 상대 증가.
# 최종 데미지(%) 를 캐릭터 주스탯% 로 환산해 다른 추천과 같은 기준으로 비교합니다.
# 1~3레벨 효과 출처: 게임 내 스킬 설명. 1~3레벨은 강화 비용 표(upgrade)가 없어 점수에만 쓰고 추천하지 않습니다.
[seed_ring.restraint]            # 리스트레인트 링: 레벨 = [지속(초), 공격력·마력 %]. 15초 미만 구간의 딜 비중은 15초 값 × 초 ÷ 15 로 줄입니다
"1" = [9, 17]
"2" = [11, 34]
"3" = [13, 51]
"4" = [15, 68]
"5" = [20, 68]
"6" = [20, 85]

[seed_ring.continuous]           # 컨티뉴어스 링(패시브): 레벨 = [보스 공격 시 데미지 %, 공격력·마력 %]
uptime = 1.0                     # 가동률. 스킬 사용 때마다 30초가 갱신되어 보스전 내내 유지된다고 봅니다
"1" = [9, 4]
"2" = [18, 6]
"3" = [27, 8]
"4" = [36, 10]
"5" = [45, 12]
"6" = [54, 14]

