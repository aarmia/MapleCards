# 점수 구간. 장비 테두리 색과 총평 랭크가 이 파일을 따릅니다. 점수 자체는 주스탯 %p 환산값입니다.
# 구간은 내림차순으로 적고 첫 일치를 씁니다. 티어 이름(ultimate, legendary …)에 어떤 색을 입힐지는 app.js 가 정합니다.
# 테두리 색은 장비의 만점 대비 %, 총평 랭크는 장비 달성률(%p 합 ÷ 만점 %p 합) 입니다.

card_highlight = [[90, "transcendent"], [86, "legendary"], [78, "unique"], [67, "epic"]]   # 장비 테두리 색: 만점 대비 %
card_highlight_default = "none"

# 총평 랭크. 위에서부터 조건을 모두 만족하는 첫 항목을 씁니다 (마지막 항목은 기본값).
# 달성률 = 칭호·뱃지를 뺀 모든 장비의 주스탯 %p 합 ÷ 만점 %p 합.
#   min    : 달성률이 이 값 이상
#   above  : 달성률이 이 값 초과
#   weapon : 착용(분석한 프리셋) 무기 이름에 이 말이 들어 있음
#   min_scroll : weapon 무기의 주문서 성공 횟수(작)가 이 값 이상
# 랭크별 색은 app/templates/components/_overall_review.html 이 정합니다.
[[overall]]
min = 97
rank = "ABSOLUTE"

[[overall]]
weapon = "데스티니"
min_scroll = 9
rank = "DESTINY+"

[[overall]]
min = 83
rank = "ELDER"

[[overall]]
weapon = "데스티니"
rank = "DESTINY"

[[overall]]
weapon = "제네시스"
above = 78
rank = "DESTINY CHALLENGER"

[[overall]]
min = 65
rank = "ASTRA"

[[overall]]
weapon = "제네시스"
min = 45
rank = "GENESIS"

# 45% 이상이지만 제네시스 무기가 아닌 경우 (데스티니 무기는 위의 DESTINY 에서 이미 정해집니다)
[[overall]]
min = 45
rank = "GENESIS CHALLENGER"

[[overall]]
min = 0
rank = "EPIC"
