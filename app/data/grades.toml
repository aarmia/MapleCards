# 점수 컷오프. 화면의 등급 문자, 카드 강조, 점수 색, 스탯 막대 색과 총평 랭크가 모두 이 파일을 따릅니다.
# 구간은 내림차순으로 적고 첫 일치를 씁니다. 티어 이름(ultimate, legendary …)에 어떤 색을 입힐지는 app.js 가 정합니다.
# 아이템 등급·카드 강조·점수 색·총평 랭크의 기준은 총점이 아니라 "기준 만점 대비 %"(score_ratio) 입니다.
# 기준 만점 = 평가하는 축의 기준점 합(캐릭터별 최상 조합 포함). 특수부위·시드링은 이미 % 척도이고 익셉셔널은 100 을 넘는 가산입니다.

item_grade = [[99, "SSS+"], [96, "SSS"], [83, "SS"], [69, "S"], [55, "A"], [41, "B"], [28, "C"], [14, "D"]]   # 기준 대비 % → 등급 문자
item_grade_default = "F"

card_highlight = [[100, "transcendent"], [96, "legendary"], [83, "unique"], [69, "epic"]]   # 아이템 카드 테두리 강조
card_highlight_default = "none"

score_color = [[96, "ultimate"], [83, "legendary"], [55, "unique"], [28, "epic"]]   # 점수 숫자 색
score_color_default = "rare"

[stat_bar]   # 축별 막대 색 구간. [기준, 티어, 초과 여부]. 초과(true)면 >, 아니면 >= 로 비교
pot = [[118, "ultimate", true], [100, "legendary", false], [92, "unique", false], [66, "epic", false], [50, "rare", false]]
pot_additional = [[48, "ultimate", true], [32, "legendary", false], [25, "unique", false], [19, "epic", false], [9, "rare", false]]
star = [[100, "legendary", false], [90, "unique", false], [75, "epic", false], [50, "rare", false]]
add = [[108, "ultimate", true], [105, "legendary", false], [90, "unique", false], [75, "epic", false], [50, "rare", false]]
default = "poor"

[stat_bar_max]   # 막대 길이가 100% 가 되는 값
add = 110.0
pot = 128.7
pot_additional = 55.0
star = 110.0

