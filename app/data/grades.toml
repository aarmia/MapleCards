# 점수 컷오프. 화면의 등급 문자, 카드 강조, 점수 색, 스탯 막대 색과 총평 랭크가 모두 이 파일을 따릅니다.
# 구간은 내림차순으로 적고 첫 일치를 씁니다. 티어 이름(ultimate, legendary …)에 어떤 색을 입힐지는 app.js 가 정합니다.
# 아이템 등급·카드 강조·점수 색·총평 랭크의 기준은 총점이 아니라 "기준 만점 대비 %"(score_ratio) 입니다.
# 기준 만점 = 평가하는 축의 기준점 합(캐릭터별 최상 조합 포함). 특수부위·시드링은 이미 % 척도이고 익셉셔널은 100 을 넘는 가산입니다.

item_grade = [[90, "SSS+"], [86, "SSS"], [78, "SS"], [67, "S"], [56, "A"], [43, "B"], [28, "C"], [14, "D"]]   # 기준 대비 % → 등급 문자. SSS+ 는 최상위 랭커 장비가 전부 들어오는 선
item_grade_default = "F"

card_highlight = [[90, "transcendent"], [86, "legendary"], [78, "unique"], [67, "epic"]]   # 아이템 카드 테두리 강조. 등급 컷과 같음: SSS+ · SSS · SS · S
card_highlight_default = "none"

score_color = [[90, "ultimate"], [78, "legendary"], [56, "unique"], [28, "epic"]]   # 점수 숫자 색
score_color_default = "rare"

[stat_bar]   # 축별 막대 색 구간. [기준, 티어, 초과 여부]. 초과(true)면 >, 아니면 >= 로 비교
pot = [[36, "ultimate", true], [30, "legendary", false], [28, "unique", false], [20, "epic", false], [15, "rare", false]]   # 유효 스탯% 합
pot_additional = [[19, "ultimate", true], [13, "legendary", false], [10, "unique", false], [8, "epic", false], [4, "rare", false]]
star = [[100, "legendary", false], [90, "unique", false], [75, "epic", false], [50, "rare", false]]
add = [[108, "ultimate", true], [105, "legendary", false], [90, "unique", false], [75, "epic", false], [50, "rare", false]]
exceptional = []   # 익셉셔널 막대는 구간 없이 기본 색(빨강)으로 통일
default = "poor"

[stat_bar_max]   # 막대 길이가 100% 가 되는 값. 아이템마다 analyzer 가 레벨·세트로 골라 bar_max 로 내려 줍니다
add = 100.0
star = 100.0
pot = 39.0                    # 윗잠재 (아이템 레벨 low_level_max 초과, 250제)
pot_low = 36.0                # 윗잠재 (200제 이하)
pot_additional = 23.0         # 에디셔널 (250제)
pot_additional_low = 20.0     # 에디셔널 (200제 이하)
low_level_max = 200
exceptional = 30.0            # 익셉셔널 (광휘 등 3회)
exceptional_pitched = 10.0    # 익셉셔널 (칠흑 1회)
soul = 20.0                   # 소울 잠재 기준 만점과 같음
special = 100.0               # 특수부위 고유 옵션 (이미 % 척도)

# 총평 랭크. 칭호·뱃지를 뺀 모든 아이템의 기준 대비 % 평균이 min 이상인 첫 항목 (최상위 랭커 98% 가 ABSOLUTE 에 들어오는 선).
# 랭크별 색은 app/templates/components/_overall_review.html 이 정합니다.
[[overall]]
min = 97
rank = "ABSOLUTE"

[[overall]]
min = 92
rank = "DESTINY+"

[[overall]]
min = 87
rank = "ELDER"

[[overall]]
min = 80
rank = "DESTINY"

[[overall]]
min = 70
rank = "ASTRA"

[[overall]]
min = 55
rank = "GENESIS"

[[overall]]
min = 0
rank = "EPIC"
