# 점수 구간. 장비 테두리 색, 축 막대 색과 총평 랭크가 이 파일을 따릅니다. 점수 자체는 주스탯 %p 환산값입니다.
# 구간은 내림차순으로 적고 첫 일치를 씁니다. 티어 이름(ultimate, legendary …)에 어떤 색을 입힐지는 app.js 가 정합니다.
# 테두리 색은 장비의 만점 대비 %, 총평 랭크는 장비 달성률(%p 합 ÷ 만점 %p 합) 입니다.

card_highlight = [[90, "transcendent"], [86, "legendary"], [78, "unique"], [67, "epic"]]   # 장비 테두리 색: 만점 대비 %
card_highlight_default = "none"

# 축별 막대 색: 축의 만점 대비 % → 티어 (app.js STAT_BAR_CLASS)
axis_bar = [[90, "ultimate"], [78, "legendary"], [67, "unique"], [50, "epic"], [28, "rare"]]
axis_bar_default = "poor"

# 총평 랭크. 칭호·뱃지를 뺀 모든 장비의 달성률(주스탯 %p 합 ÷ 만점 %p 합)이 min 이상인 첫 항목. 샘플 8명이 기존 랭크와 같게 나오는 선.
# 랭크별 색은 app/templates/components/_overall_review.html 이 정합니다.
[[overall]]
min = 97
rank = "ABSOLUTE"

[[overall]]
min = 92
rank = "DESTINY+"

[[overall]]
min = 87
rank = "ELDER"

[[overall]]
min = 80
rank = "DESTINY"

[[overall]]
min = 70
rank = "ASTRA"

[[overall]]
min = 55
rank = "GENESIS"

[[overall]]
min = 0
rank = "EPIC"
