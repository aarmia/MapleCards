<template x-for="(item, index) in getFilteredItems()" :key="item.name + index">
    <div class="bg-white rounded-2xl border border-slate-200 p-4 md:p-5 flex flex-col md:flex-row gap-3 md:gap-6 shadow-sm animate-fade-in">

        <!-- 모바일: 아이콘 · 이름 · 등급을 한 줄 머리로. 데스크톱: 왼쪽 아이콘 열 -->
        <div class="flex items-center gap-3 md:flex-col md:justify-center md:min-w-[80px] md:gap-0">
            <span class="hidden md:block text-[9px] font-black mb-2 tracking-widest uppercase text-slate-400" x-text="'Rank ' + (index+1)"></span>
            <div @click="openItemDetail(item)" class="relative p-1.5 md:p-2 rounded-2xl cursor-pointer hover:scale-110 transition-transform active:scale-95 group shrink-0" :class="getBorderColor(item.score_ratio)">
                <img :src="item.icon" class="w-11 h-11 md:w-12 md:h-12 object-contain drop-shadow-sm">
                <span x-show="item.star > 0" class="absolute -top-2 -right-2 text-[10px] font-bold px-1.5 md:px-2 py-0.5 rounded-full border-2 border-white shadow-sm bg-slate-900 text-white" x-text="item.star + '★'"></span>
            </div>
            <div class="flex-1 min-w-0 md:hidden" @click="openItemDetail(item)">
                <p class="text-[10px] font-black tracking-widest uppercase text-slate-400" x-text="'Rank ' + (index+1) + ' · ' + item.part"></p>
                <h3 class="font-black text-slate-800 tracking-tight text-base leading-snug break-keep" x-text="item.name"></h3>
            </div>
            <div class="md:hidden text-right shrink-0">
                <span x-show="item.scored !== false" class="block text-2xl font-black tracking-tighter leading-none text-slate-800 tabular-nums" x-text="item.total_score"></span>
                <span x-show="item.scored !== false" class="block text-[10px] font-black text-slate-400 mt-1">%p</span>
            </div>
        </div>

        <div class="flex-1 min-w-0">
            <div class="hidden md:flex items-center gap-2 mb-2">
                <h3 class="font-black text-slate-800 tracking-tight text-lg" x-text="item.name"></h3>
                <span class="text-[9px] px-2 py-1 rounded font-black bg-blue-600 text-white uppercase tracking-tighter" x-text="item.guide_tag || 'INFO'"></span>
            </div>
            <div class="rounded-xl p-3 border mb-3 md:mb-4 shadow-sm" :class="getGuideStyle(item.guide)">
                <span class="md:hidden inline-block mb-1 text-[9px] px-1.5 py-0.5 rounded font-black bg-blue-600 text-white uppercase tracking-tighter" x-text="item.guide_tag || 'INFO'"></span>
                <p class="text-[13px] leading-snug font-bold break-keep" x-text="item.guide_message || item.guide || ''"></p>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-3">
                <template x-for="(val, key) in item.detail">
                    <div class="relative">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] md:text-[9px] font-bold text-slate-400 uppercase" x-text="key == 'base' ? '기본 옵션' : key == 'scroll' ? '주문서' : key == 'pot_additional' ? '에디셔널' : key == 'pot' ? '잠재능력' : key == 'add' ? '추가옵션' : key == 'soul' ? '소울' : key == 'special' ? '고유 옵션' : key == 'exceptional' ? '익셉셔널' : '별'"></span>
                            <span class="text-xs md:text-[11px] font-black text-slate-700" x-text="val + '%p'"></span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden border border-slate-50">
                            <div class="h-full transition-all duration-500 rounded-full" :class="getStatColor(val, key, item)" :style="`width: ${getStatWidth(val, key, item)}%` "></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div class="hidden md:flex w-28 border-l border-slate-100 flex-col justify-center items-center bg-slate-50/50 py-4 relative group">
            <span class="text-[9px] font-bold text-slate-400 tracking-widest mb-1" x-text="(report?.spec_up?.stat_label || '주스탯') + ' 환산'"></span>
            <span x-show="item.scored !== false" class="text-3xl font-black tracking-tighter text-slate-800 tabular-nums" x-text="item.total_score"></span>
            <span x-show="item.scored !== false" class="text-xs font-black text-slate-400 mt-0.5">%p</span>
        </div>

    </div>
</template>
