<div class="transition-layout flex flex-col items-center"
     :class="report ? 'md:flex-row md:justify-between md:items-end mb-8 gap-4' : 'mb-12'">
    <div class="flex items-start">
        <div @click="reset()" class="cursor-pointer transition-layout group relative" :class="report ? 'w-48 md:w-56' : 'w-72 md:w-96 mb-3'">
            <img src="/static/images/logo.png" alt="MECULATOR Logo" class="w-full h-auto drop-shadow-sm group-hover:opacity-80 transition-opacity">
        </div>
        <button @click="showHelp = true; helpTab = 'guide'" class="ml-2 p-2 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-blue-600 mt-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </button>
    </div>

    <div class="w-full" :class="report ? 'md:w-[36rem]' : ''">
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex gap-2 transition-layout" :class="report ? 'w-full shadow-none border-b-2 rounded-none bg-transparent border-slate-300' : 'w-full'">
            <input x-model="nickname" @keyup.enter="fetchReport()" type="text" placeholder="캐릭터 닉네임 입력" class="flex-1 border-none bg-slate-100/50 rounded-xl px-4 py-2 outline-none transition-all font-medium" :class="report ? 'text-base bg-white' : 'text-lg'">
            <button @click="fetchReport()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition-all min-w-[100px]">
                <span x-show="!loading" x-text="report ? '재검진' : '검진 시작'"></span>
                <span x-show="loading" class="animate-spin inline-block">⏳</span>
            </button>
        </div>

        <div x-cloak x-show="loading" class="mt-4 rounded-2xl border border-blue-100 bg-white p-5 shadow-sm animate-fade-in">
            <div x-show="loadingStage === 'waiting'" class="mb-4 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-amber-800">
                <p class="text-xs font-black">서버가 혼잡하여 진단 순서를 기다리고 있습니다.</p>
                <p class="mt-1 text-[11px]" x-text="queuePosition ? '현재 대기 순서: ' + queuePosition + '번째' : '잠시만 기다려주세요.'"></p>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <template x-for="step in [
                    {key: 'character', number: 1, label: '캐릭터 확인'},
                    {key: 'equipment', number: 2, label: '장비 조회'},
                    {key: 'analysis', number: 3, label: '결과 생성'}
                ]" :key="step.key">
                    <div class="rounded-xl border px-3 py-3 text-center transition-all"
                         :class="loadingStage === step.key ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-sm' : 'border-slate-100 bg-slate-50 text-slate-400'">
                        <div class="mx-auto mb-1 flex h-6 w-6 items-center justify-center rounded-full text-[10px] font-black"
                             :class="loadingStage === step.key ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-500'"
                             x-text="step.number"></div>
                        <p class="text-[10px] font-black" x-text="step.label"></p>
                    </div>
                </template>
            </div>
            <p class="mt-3 text-center text-[11px] font-bold text-slate-500"
               x-text="loadingStage === 'waiting' ? '요청 가능 시 자동으로 시작됩니다.' : loadingStage === 'character' ? '닉네임과 캐릭터 정보를 확인하고 있습니다.' : loadingStage === 'equipment' ? '착용 장비와 스탯 정보를 불러오고 있습니다.' : '점수를 계산하고 진단서를 만들고 있습니다.'"></p>
        </div>

        <div x-cloak x-show="errorMessage" class="mt-4 relative overflow-hidden rounded-2xl border border-rose-200/80 bg-gradient-to-r from-rose-50 via-white to-orange-50 px-4 py-4 shadow-[0_10px_30px_rgba(244,63,94,0.08)]">
            <div class="absolute inset-y-0 left-0 w-1.5 bg-gradient-to-b from-rose-400 to-orange-300"></div>
            <div class="flex items-center gap-4 pl-2">
                <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-white text-rose-500 shadow-sm ring-1 ring-rose-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86l-7.55 13.09A2 2 0 004.47 20h15.06a2 2 0 001.73-3.05L13.71 3.86a2 2 0 00-3.42 0z" />
                    </svg>
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-[11px] font-black uppercase tracking-[0.22em] text-rose-400" x-text="errorStatus ? 'Lookup Error · ' + errorStatus : 'Lookup Error'"></p>
                    <p class="mt-1 text-lg font-black tracking-tight text-slate-900" x-text="errorMessage"></p>
                    <p class="mt-1.5 text-sm leading-relaxed text-slate-600" x-text="getErrorHint()"></p>
                </div>
            </div>
        </div>
    </div>
</div>
