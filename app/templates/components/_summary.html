<div class="bg-white border-t-4 md:border-t-[12px] border-blue-600 rounded-3xl shadow-xl mb-4 md:mb-6 relative overflow-hidden border border-slate-200">
    <div class="flex flex-col md:flex-row">
        <!-- 큰 캐릭터 영역은 데스크톱만. 모바일은 아래 한 줄 프로필의 썸네일로 대신합니다. -->
        <div class="hidden w-full md:w-[22%] bg-slate-50 md:flex flex-col items-center justify-center p-4 border-b md:border-b-0 md:border-r border-slate-100 relative overflow-hidden min-h-[150px] md:min-h-[220px]">
            <img x-show="report?.character_image" :src="report?.character_image || ''" class="w-28 md:w-full h-auto object-contain drop-shadow-[0_10px_15px_rgba(0,0,0,0.15)] z-10 scale-[1.6] md:scale-[2.0]" alt="Character Image">
            <div x-show="!report || !report.character_image" class="text-slate-300 font-bold text-xs tracking-widest z-10 flex flex-col items-center">
                <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                NO IMAGE
            </div>
        </div>
        <div class="flex-1 p-4 md:p-8 flex flex-col justify-between">
            <!-- 모바일 한 줄 프로필 -->
            <div class="md:hidden flex items-center gap-3 mb-4">
                <div class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-100 overflow-hidden flex items-center justify-center shrink-0">
                    <img x-show="report?.character_image" :src="report?.character_image || ''" class="w-14 h-14 object-contain scale-[2.6] translate-y-1" alt="">
                </div>
                <div class="min-w-0 flex-1">
                    <p class="font-black text-slate-800 text-lg leading-tight truncate" x-text="report?.character || ''"></p>
                    <p class="text-xs font-bold text-slate-500 truncate" x-text="report ? report.class + ' · Lv. ' + report.level : ''"></p>
                </div>
                <span class="text-[10px] font-bold text-slate-400 shrink-0" x-text="getTodayDate()"></span>
            </div>
            <div class="flex flex-col md:flex-row justify-between items-start gap-4 md:gap-6 md:mb-8">
                <div class="hidden md:block">
                    <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-tight uppercase flex items-center gap-2">
                        <span class="text-blue-600">✚</span> Diagnosis Report
                    </h1>
                    <p class="text-[10px] text-slate-400 font-bold tracking-[0.2em] uppercase mt-1">Meculator Precision Scan</p>
                </div>
                <div class="grid grid-cols-2 md:flex md:flex-col gap-3 md:gap-4 text-left md:text-right w-full md:w-auto">
                    <div class="flex flex-col md:items-end">
                        <span class="text-[10px] font-black text-red-400 tracking-widest block mb-1">현재 전투력 · 넥슨 API</span>
                        <span class="text-xl md:text-4xl font-black text-red-500 tracking-tighter break-all" x-text="report?.combat_power ? Number(report.combat_power).toLocaleString() : 'N/A'"></span>
                        <!-- 모바일은 추정·안내 문구를 버튼으로 펼칩니다. 데스크톱은 항상 보입니다. -->
                        <button type="button" x-show="['adjusted', 'unsupported'].includes(report?.combat_power_basis?.status)"
                                @click="showPowerNote = !showPowerNote" :aria-expanded="showPowerNote"
                                class="md:hidden mt-1 self-start inline-flex items-center gap-1 text-[11px] font-bold text-slate-500 border border-slate-200 rounded-full px-2 py-0.5">
                            <span>ⓘ</span><span x-text="report?.combat_power_basis?.status === 'adjusted' ? '최적 프리셋 추정' : '추정 생략'"></span>
                        </button>
                        <div class="flex-col md:items-end" :class="showPowerNote ? 'flex' : 'hidden md:flex'">
                            <span x-show="report?.combat_power_basis?.status === 'adjusted'" class="text-sm md:text-base font-bold text-slate-500 mt-1 leading-snug break-keep">
                                최적 프리셋 추정 · <span class="font-black text-red-400 tabular-nums" x-text="Number(report?.combat_power_adjusted).toLocaleString()"></span>
                            </span>
                            <span x-show="report?.combat_power_basis?.status === 'unsupported'" class="text-[11px] md:text-[10px] text-slate-500 break-keep" x-text="'추정 생략 · ' + (report?.combat_power_basis?.reason || '')"></span>
                        </div>
                    </div>
                    <div class="flex flex-col md:items-end">
                        <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest block mb-1">Total Score</span>
                        <span class="text-xl md:text-4xl font-black text-blue-600 tracking-tighter break-all" x-text="report?.results ? report.results.filter(i => !i.is_wse && !i.is_special).reduce((acc, item) => acc + item.total_score, 0).toLocaleString() : 0"></span>
                    </div>
                </div>
            </div>
            <div class="hidden md:grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 text-sm border-t border-slate-100 pt-4 md:pt-6">
                <div class="flex flex-col gap-1 md:border-r md:border-slate-100 md:pr-4">
                    <span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Patient</span>
                    <span class="font-bold text-slate-700 truncate" x-text="report?.character || ''"></span>
                </div>
                <div class="flex flex-col gap-1 md:border-r md:border-slate-100 md:pr-4">
                    <span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Job Class</span>
                    <span class="font-bold text-slate-700 truncate" x-text="report?.class || ''"></span>
                </div>
                <div class="flex flex-col gap-1 md:border-r md:border-slate-100 md:pr-4">
                    <span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Level</span>
                    <span class="font-bold text-slate-700" x-text="report ? 'Lv. ' + report.level : ''"></span>
                </div>
                <div class="flex flex-col gap-1">
                    <span class="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Date</span>
                    <span class="font-bold text-slate-700" x-text="getTodayDate()"></span>
                </div>
            </div>
        </div>
    </div>
</div>
