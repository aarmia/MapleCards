<template x-if="report?.profile?.optimization">
    <section class="mb-5 rounded-2xl border border-slate-200 bg-white p-5 text-sm text-slate-700">
        <h3 class="font-bold mb-2">환산 기준 프리셋</h3>
        <template x-if="report.profile.optimization.selected">
            <div>
                <div class="flex flex-wrap gap-2">
                    <template x-for="[key, label] in Object.entries({equipment:'장비', hyper_stat:'하이퍼스탯', union:'유니온', link:'링크', ability:'어빌리티'})" :key="key">
                        <span class="rounded-lg bg-slate-100 px-3 py-1" x-text="label + ' · ' + (report.profile.optimization.selected[key] === 'current' || report.profile.optimization.selected[key] == null ? '현재' : report.profile.optimization.selected[key] + '번')"></span>
                    </template>
                </div>
                <p class="mt-2 text-xs text-slate-500" x-text="report.profile.optimization.combinations_evaluated + '개 조합 비교 · 보스 방어율 ' + report.profile.optimization.boss_defense_percent + '% 가정 · 실제 DPS가 아닌 스탯 비교 지수'"></p>
            </div>
        </template>
        <template x-for="note in report.profile.optimization.limitations || []" :key="note">
            <p class="mt-1 text-xs text-slate-500" x-text="note"></p>
        </template>
        <template x-if="report.profile.optimization.set_projection">
            <div class="mt-3 border-t border-slate-100 pt-3">
                <p class="font-semibold" x-text="'세트 효과 · ' + ({applied:'API 대조 후 차이 반영', verified_unchanged:'API 대조 통과 · 변화 없음', unresolved:'검증 미완료 · 보정 제외'}[report.profile.optimization.set_projection.status] || '확인 필요')"></p>
                <template x-for="change in report.profile.optimization.set_projection.changes || []" :key="change.set">
                    <p class="mt-1 text-xs" x-text="change.set + ' ' + change.before + ' → ' + change.after + '세트'"></p>
                </template>
                <template x-if="report.profile.optimization.set_projection.status === 'applied'">
                    <p class="mt-2 text-xs text-blue-700" x-text="'고정 주스탯 ' + (report.profile.optimization.set_projection.delta[report.profile.main_stat.toLowerCase()] || 0) + ', 공격력 ' + report.profile.optimization.set_projection.delta.attack + ', 마력 ' + report.profile.optimization.set_projection.delta.magic + ', 보공 ' + report.profile.optimization.set_projection.delta.boss + '%p, 크뎀 ' + report.profile.optimization.set_projection.delta.crit + '%p'"></p>
                </template>
                <template x-for="reason in report.profile.optimization.set_projection.reasons || []" :key="reason">
                    <p class="mt-1 text-xs text-amber-700" x-text="reason"></p>
                </template>
            </div>
        </template>
    </section>
</template>
