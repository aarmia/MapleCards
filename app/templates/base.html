<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메큘레이터 (MECULATOR) | 장비 딸깍 진단서</title>
    <meta name="description" content="Nexon Open API 기반 실시간 메이플스토리 장비 진단 서비스. 내 캐릭터의 장비 점수와 강화 효율(100억 메소당 주스탯%) 기반 스펙업 추천을 받아보세요.">

    <meta name="keywords" content="메큘레이터, MECULATOR, 딸깍, 장비딸깍, 메이플스토리, 장비분석, 메이플스토리 진단">
    <meta name="google-site-verification" content="2fm4LwvSh6Pv-cCyGQlOxVyzFHDmcKSLzIzonyh5F6E" />
    <meta property="og:title" content="메큘레이터 - 내 캐릭터 장비 분석">
    <meta property="og:description" content="실시간 데이터를 바탕으로 최적의 장비 교체 순서를 제안합니다.">
    <meta property="og:url" content="https://meculator.onrender.com">
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/static/images/favicon.ico" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.MECULATOR_GRADES = {{ grades_json|safe }};</script>
    <script>window.MECULATOR_PRICING = {{ pricing_json|safe }};</script>
    <script defer src="/static/js/app.js?v={{ app_js_version }}"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Anton&family=Orbitron:wght@900&family=Cinzel:wght@900&display=swap');
        [x-cloak] { display: none !important; }
        .medical-grid { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px; }
        body { font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.025em; }

        .font-rank-cyber {
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 0.05em;
        font-style: italic; /* 약간 기울이면 더 세련되어 보입니다 */
        }

        .font-rank-impact {
        font-family: 'Anton', sans-serif;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        }

        .font-rank-classic {
        font-family: 'Cinzel', serif;
        letter-spacing: 0.15em;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-ultimate {
            background: linear-gradient(270deg, #34d399, #3b82f6, #a855f7, #ec4899);
            background-size: 400% 400%;
            animation: rainbow-flow 3s ease infinite;
        }

        /* DESTINY+ 총평 카드: 흐르는 보라·자홍 그라데이션 + 주기적으로 지나가는 빛 */
        /* 카드 자체에는 등장 애니메이션(animate-fade-in)이 걸려 있어, 흐르는 배경은 ::before 층에 둡니다 */
        .rank-destiny-plus { background: #1e1b4b; }
        .rank-destiny-plus::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(120deg, #1e1b4b, #6d28d9, #c026d3, #f472b6, #7c3aed, #1e1b4b);
            background-size: 300% 300%;
            animation: rainbow-flow 8s ease infinite;
        }
        .rank-destiny-plus::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.35) 50%, transparent 65%);
            transform: translateX(-120%);
            animation: rank-shine 4s ease-in-out infinite;
        }
        @keyframes rank-shine {
            0%, 55% { transform: translateX(-120%); }
            100% { transform: translateX(120%); }
        }
        .rank-glow-destiny { text-shadow: 0 0 12px rgba(244, 114, 182, 0.9), 0 0 28px rgba(192, 38, 211, 0.7); }
        /* ABSOLUTE 총평 카드: 흐르는 금빛 그라데이션 + 더 밝은 빛 쓸림 + 숨 쉬는 금빛 번짐 (DESTINY+ 보다 한 단계 위) */
        .rank-absolute { background: #1c1917; }
        .rank-absolute.animate-fade-in { animation: fadeIn 0.4s ease-out forwards, rank-gold-pulse 3s ease-in-out infinite; }
        .rank-absolute::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(115deg, #0c0a09, #78350f, #b45309, #f59e0b, #d97706, #78350f, #0c0a09);
            background-size: 300% 300%;
            animation: rainbow-flow 7s ease infinite;
        }
        .rank-absolute::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 251, 235, 0.55) 48%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 251, 235, 0.55) 52%, transparent 70%);
            transform: translateX(-120%);
            animation: rank-shine 3s ease-in-out infinite;
        }
        @keyframes rank-gold-pulse {
            0%, 100% { box-shadow: 0 0 24px rgba(250, 204, 21, 0.45); }
            50% { box-shadow: 0 0 60px rgba(250, 204, 21, 0.75), 0 0 120px rgba(245, 158, 11, 0.35); }
        }
        .rank-glow-absolute { text-shadow: 0 0 10px rgba(254, 240, 138, 0.95), 0 0 26px rgba(245, 158, 11, 0.8), 0 2px 0 rgba(120, 53, 15, 0.6); }

        @media (prefers-reduced-motion: reduce) {
            .rank-destiny-plus::before, .rank-destiny-plus::after, .rank-absolute::before, .rank-absolute::after { animation: none; }
            .rank-absolute.animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        }

        .transition-layout { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 medical-grid min-h-screen font-sans text-slate-900 pb-20">
    <div x-data="meculatorApp"
         class="max-w-3xl mx-auto py-12 px-4 transition-all duration-500"
         :class="report ? 'max-w-5xl' : 'max-w-3xl'">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
