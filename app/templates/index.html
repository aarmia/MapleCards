{% extends "base.html" %}

{% block content %}
    {% include "components/_header.html" %}

    <div x-cloak x-show="report && !report.error" id="report-area" class="p-2 animate-fade-in">
        <div class="grid grid-cols-3 gap-1.5 mb-4 md:flex md:justify-end md:gap-2">
            <template x-for="mode in [['equip', '🧰 장비창', '🧰 장비창'], ['top5', '⚠️ 취약 아이템 5종', '⚠️ 취약 5종'], ['all', '📊 모든 아이템 점수', '📊 전체 점수']]" :key="mode[0]">
                <button @click="viewMode = mode[0]"
                        class="flex items-center justify-center gap-2 text-[11px] md:text-xs font-bold px-2 md:px-4 py-2.5 md:py-2 rounded-lg transition-all shadow-sm border leading-tight text-center"
                        :class="viewMode === mode[0] ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'">
                    <span class="hidden md:inline" x-text="mode[1]"></span><span class="md:hidden whitespace-nowrap" x-text="mode[2]"></span>
                </button>
            </template>
        </div>

        {% include "components/_summary.html" %}

        {% include "components/_overall_review.html" %}

        <div class="space-y-4">

            <template x-if="viewMode === 'equip'">
                {% include "components/_equip_grid.html" %}
            </template>

            <template x-if="viewMode === 'top5' || viewMode === 'all'">
                <div class="space-y-4">
                    {% include "components/_item_list.html" %}
                </div>
            </template>
        </div>
    </div>

    {% include "components/_modals.html" %}

    {% include "components/_footer.html" %}

{% endblock %}
